name: lightuptech
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  connectivity_plus: ^7.0.0
  flutter_dotenv: ^6.0.0
  get_storage: ^2.1.1
  cached_network_image: ^3.4.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.3
  lottie: ^3.3.2
  device_preview: ^1.3.1
  google_fonts: ^6.3.2
  flutter_native_splash: ^2.4.7
  rxdart: ^0.28.0
  pin_code_fields: ^8.0.1
  dotted_border: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true

  assets:
    - app.env
    - assets/fonts/
    - assets/images/
    - assets/icons/

  fonts:
    - family: Typold
      fonts:
        - asset: assets/fonts/typold-regular.otf
          weight: 400
        - asset: assets/fonts/typold-medium.otf
          weight: 500
        - asset: assets/fonts/typold-bold.otf
          weight: 600
        - asset: assets/fonts/typold-extra-bold.otf
          weight: 700
        - asset: assets/fonts/typold-extended-extra-bold.otf
          weight: 800
    - family: AppIcons
      fonts:
        - asset: assets/fonts/app-icons.ttf
